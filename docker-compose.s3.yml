# Puts the lake on an S3-compatible server instead of a local volume.
#
#   F="-f docker-compose.yml -f docker-compose.s3.yml"
#   docker compose $F up -d redpanda topic-init s3
#   docker compose $F run --rm producer
#   docker compose $F run --rm ingest
#   docker compose $F run --rm transform
#
# MinIO no longer publishes community container images, so local development uses Adobe's S3Mock
# (the same image the integration tests run against in CI). Any S3-compatible endpoint works:
# point SHOPSTREAM_S3_ENDPOINT_URL / SHOPSTREAM_S3_ENDPOINT at a MinIO build, Ceph, or AWS S3.

x-s3-env: &s3-env
  SHOPSTREAM_LAKE_URI: s3://shopstream-lake/bronze
  SHOPSTREAM_S3_ENDPOINT_URL: http://s3:9090
  SHOPSTREAM_S3_ENDPOINT: s3:9090
  SHOPSTREAM_S3_ACCESS_KEY_ID: test
  SHOPSTREAM_S3_SECRET_ACCESS_KEY: test
  SHOPSTREAM_S3_USE_SSL: "false"
  SHOPSTREAM_S3_URL_STYLE: path

services:
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: shopstream-lake
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9090"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    environment: *s3-env
    depends_on:
      s3:
        condition: service_healthy

  transform:
    environment: *s3-env
    command:
      - mkdir -p /app/data/warehouse && shopstream quality && cd dbt && dbt build --profiles-dir . --target s3 && shopstream report
    depends_on:
      s3:
        condition: service_healthy
